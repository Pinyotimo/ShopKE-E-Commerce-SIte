<!doctype html>
<html lang="en" data-theme="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fbfaf6" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23059669'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>S</text></svg>" />
    <!-- Apply the saved palette and mode before first paint (no flash). Mirrors applyToDocument in src/theme.tsx. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('theme') || '{}');
        var r = document.documentElement;
        var palettes = ['emerald', 'ocean', 'violet', 'rose', 'sunset', 'slate'];
        if (palettes.indexOf(t.color) > -1) r.setAttribute('data-theme', t.color);
        var dark = t.mode === 'dark' || (t.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        r.classList.toggle('dark', dark);
        r.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>ShopKE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
